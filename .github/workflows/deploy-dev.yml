name: Deploy dev

on:
  push:
    branches:
      - main
  # Deploys everything, regardless of what changed.
  workflow_dispatch:

# Decides what changed and in what order the pieces deploy.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.filter.outputs.infra }}
      # No hyphen: '-' is also subtraction in expressions.
      frontend: ${{ steps.filter.outputs.frontend }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            infra:
              - 'infra/**'
              - 'scripts/infra-deploy.sh'
              - 'docker/infra.Dockerfile'
              - '.github/actions/deploy-infra/**'
            frontend:
              - 'front-end/**'
              - 'scripts/front-end-deploy.sh'
              - '.github/workflows/deploy-front-end.yml'
            api:
              - 'api/**'
              - 'scripts/api-build.sh'
              - 'scripts/api-deploy.sh'
              - 'docker/api.Dockerfile'
              - '.github/workflows/deploy-api.yml'

  infra:
    needs: changes
    # Skipped when nothing under infra/ changed. A manual run deploys regardless.
    if: >-
      needs.changes.outputs.infra == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Not a reusable workflow: only a job declaring an environment reads its
    # secrets.
    environment: dev
    permissions:
      # Required for the OIDC token that the role assumption exchanges.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-infra
        with:
          environment: dev
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Dev may not be public, so missing credentials fail the deployment.
          require-login-wall: true
          # Empty until the domain is registered; dev uses its CloudFront name.
          domain-name: ${{ vars.MUNCHER_DOMAIN_NAME }}
          use-environment-subdomain: "true"
          # Resolved from the secrets of the dev environment declared above.
          login-user: ${{ secrets.FRONTEND_LOGIN_USER }}
          login-password: ${{ secrets.FRONTEND_LOGIN_PASSWORD }}

  front-end:
    needs: [changes, infra]
    # Runs when infra succeeded *or* was skipped — a skipped dependency would
    # otherwise skip this too. Also runs after a redeploy: a new bucket is empty.
    if: >-
      !cancelled() &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (needs.changes.outputs.frontend == 'true' ||
       needs.infra.result == 'success' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-front-end.yml
    with:
      environment: dev

  api:
    needs: [changes, infra]
    # Same reasoning as the front-end above, and for the same reason after a
    # redeploy: a new function holds only the template's placeholder.
    if: >-
      !cancelled() &&
      (needs.infra.result == 'success' || needs.infra.result == 'skipped') &&
      (needs.changes.outputs.api == 'true' ||
       needs.infra.result == 'success' ||
       github.event_name == 'workflow_dispatch')
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: dev
