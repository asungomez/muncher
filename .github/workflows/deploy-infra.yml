name: Deploy infra

# Not a reusable workflow: one called with `workflow_call` cannot read the
# secrets of the environment it declares.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - dev
          - prod
        default: dev

# CloudFormation refuses concurrent operations on a stack, so runs queue. They
# are not cancelled: interrupting a deployment is worse than waiting.
concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # On the job itself, which is what gives its steps the environment's secrets.
    environment: ${{ inputs.environment }}

    permissions:
      # Required for the OIDC token that the role assumption exchanges.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-infra
        with:
          environment: ${{ inputs.environment }}
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Development must never be publicly reachable.
          require-login-wall: ${{ inputs.environment == 'dev' }}
          domain-name: ${{ vars.MUNCHER_DOMAIN_NAME }}
          # Only development is served from a subdomain named after itself.
          use-environment-subdomain: ${{ inputs.environment == 'dev' }}
          # From the environment's secrets; undefined means no login wall.
          login-user: ${{ secrets.FRONTEND_LOGIN_USER }}
          login-password: ${{ secrets.FRONTEND_LOGIN_PASSWORD }}
