name: Deploy infra

on:
  # Called by deploy-dev.yml, which decides whether the infrastructure changed.
  workflow_call:
    inputs:
      environment:
        description: Environment to deploy
        type: string
        default: dev
      require-login-wall:
        description: >-
          Fail rather than deploy if the login wall credentials are missing. Set
          for environments that must never be publicly reachable.
        type: boolean
        default: false
    secrets:
      # Declared so the names exist in the `secrets` context of this called
      # workflow — without a declaration they resolve to empty here, whatever the
      # environment defines. Callers pass nothing: the values come from the
      # secrets of the environment the deploy job targets, which take precedence
      # over anything a caller could pass.
      FRONTEND_LOGIN_USER:
        description: User for the front-end login wall
        required: false
      FRONTEND_LOGIN_PASSWORD:
        description: Password for the front-end login wall
        required: false
  # Deploys on demand, whether or not anything changed — for recreating an
  # environment that was torn down, or reapplying after a manual change.
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - dev
          - prod
        default: dev

# CloudFormation refuses concurrent operations on the same stack, so runs queue
# instead of racing. In-progress runs are not cancelled: interrupting a
# deployment mid-flight is worse than waiting for it.
concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    permissions:
      # Required for the OIDC token that the role assumption exchanges. Without
      # it no token is issued and the deployment fails at the credentials step.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # The same target a developer runs, in the same image, so the two cannot
      # drift apart. See agents/local-development/containerized-development.md.
      - name: Deploy the stack
        # Resolved from the secrets of the environment this job targets, not
        # from the repository and not from the caller: because this job declares
        # an environment, GitHub uses the environment's secret and ignores
        # anything a caller passes. An environment that does not define them —
        # production — therefore deploys with no login wall, and cannot be given
        # one by any caller or by a manual run.
        env:
          FRONTEND_LOGIN_USER: ${{ secrets.FRONTEND_LOGIN_USER }}
          FRONTEND_LOGIN_PASSWORD: ${{ secrets.FRONTEND_LOGIN_PASSWORD }}
          MUNCHER_REQUIRE_LOGIN_WALL: ${{ inputs.require-login-wall && '1' || '' }}
        run: make infra-deploy ENVIRONMENT=${{ inputs.environment }}
