name: Deploy infra

# Deploys on demand, whether or not anything changed — for recreating an
# environment that was torn down, or reapplying after a manual change. The
# automatic path lives in deploy-dev.yml and deploy-prod.yml, which run the same
# composite action.
#
# This is no longer a reusable workflow: a workflow called with `workflow_call`
# cannot read the secrets of the environment it declares, so the deployment steps
# live in .github/actions/deploy-infra and run inside a job that declares the
# environment.
on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options:
          - dev
          - prod
        default: dev

# CloudFormation refuses concurrent operations on the same stack, so runs queue
# instead of racing. In-progress runs are not cancelled: interrupting a
# deployment mid-flight is worse than waiting for it.
concurrency:
  group: deploy-infra-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Declared on the job itself, which is what gives its steps access to this
    # environment's secrets.
    environment: ${{ inputs.environment }}

    permissions:
      # Required for the OIDC token that the role assumption exchanges. Without
      # it no token is issued and the deployment fails at the credentials step.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-infra
        with:
          environment: ${{ inputs.environment }}
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          # Development must never be publicly reachable.
          require-login-wall: ${{ inputs.environment == 'dev' }}
          # Resolved from the secrets of the environment above. An environment
          # that does not define them deploys with no login wall.
          login-user: ${{ secrets.FRONTEND_LOGIN_USER }}
          login-password: ${{ secrets.FRONTEND_LOGIN_PASSWORD }}
