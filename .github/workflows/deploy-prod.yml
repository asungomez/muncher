name: Deploy prod

# Manual only: production is never deployed as a side effect of pushing. Who may
# run it is gated by required reviewers on the `prod` environment.
on:
  workflow_dispatch:

jobs:
  infra:
    runs-on: ubuntu-latest
    # No login wall credentials are defined, so the site is served openly.
    environment: prod
    permissions:
      # Required for the OIDC token that the role assumption exchanges.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/deploy-infra
        with:
          environment: prod
          role-to-assume: ${{ vars.AWS_DEPLOYMENT_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          domain-name: ${{ vars.MUNCHER_DOMAIN_NAME }}
          # Production is served from the domain itself, without a subdomain.
          use-environment-subdomain: "false"

  # Waits for the stack: the bucket it uploads to has to exist first.
  front-end:
    needs: infra
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-front-end.yml
    with:
      environment: prod

  # Waits for the stack for the same reason: the function it uploads to has to
  # exist first.
  api:
    needs: infra
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-api.yml
    with:
      environment: prod
