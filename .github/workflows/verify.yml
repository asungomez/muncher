name: Verify
on:
  pull_request:
    branches:
      - main

# CI deliberately installs no toolchain of its own. It builds the same image a
# developer's pre-commit hook builds and runs the same checks inside it, so the
# two cannot drift apart.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the CI image
        run: docker build -f docker/ci.Dockerfile -t muncher-ci:local .

      - name: Run every check
        run: ./scripts/run-in-container.sh pre-commit run --all-files --show-diff-on-failure

      - name: Build the front-end
        run: ./scripts/run-in-container.sh bash -c 'cd front-end && yarn build'
