name: Verify
on:
  pull_request:
    branches:
      - main

# CI installs no toolchain: it runs the same make targets, in the same images,
# as a developer does.
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run every check
        run: make checks

      - name: Build the front-end
        run: make front-end-build

      - name: Build the memoria
        run: make memoria-build
