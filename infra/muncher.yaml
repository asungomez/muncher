AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  Muncher. One stack per environment: create a stack from this template and give
  it an Environment name. Everything else is derived, so dev and prod differ by
  exactly one value.

Parameters:
  Environment:
    Type: String
    Description: >-
      Name of the environment this stack provisions. Every resource name is
      derived from it, so two stacks can coexist in one account.
    AllowedValues:
      - dev
      - prod
    # The cheap environment is the default: an unset parameter must never
    # provision the production one.
    Default: dev

  FrontEndLoginUser:
    Type: String
    Description: >-
      User for the login wall in front of the front-end. Leave empty, together
      with the password, to serve the site without one.
    Default: ""

  FrontEndLoginPassword:
    Type: String
    Description: >-
      Password for the login wall. Only takes effect when the user is set too.
    Default: ""
    # Keeps the value out of the console and the stack events. Note that it is
    # still readable from the function this template generates, so the wall is a
    # barrier against casual access, not a secret-bearing security control.
    NoEcho: true

  DomainName:
    Type: String
    Description: >-
      Registered domain the environment is served from — for example
      muncher.com. Empty serves the site from its CloudFront domain instead, and
      creates no DNS records or certificate.
    Default: ""

  UseEnvironmentSubdomain:
    Type: String
    Description: >-
      Whether to serve this environment from a subdomain named after it
      (dev.muncher.com) or from the domain itself (muncher.com).
    AllowedValues:
      - "true"
      - "false"
    Default: "true"

  CertificateArn:
    Type: String
    Description: >-
      Certificate covering the name above, issued by the stack in
      infra/certificate.yaml. Required when a domain is given, because a
      certificate for CloudFront has to be created in us-east-1 and this stack
      is not deployed there.
    Default: ""

Conditions:
  # The wall exists only when both halves of the credential are supplied, so an
  # environment deployed without them — production — has no wall at all.
  # A domain is in play only when both halves are present: the name, and the
  # certificate that a stack in us-east-1 had to issue for it.
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Not [!Equals [!Ref CertificateArn, ""]]

  UseSubdomain: !And
    - !Not [!Equals [!Ref DomainName, ""]]
    - !Equals [!Ref UseEnvironmentSubdomain, "true"]

  LoginWallEnabled: !And
    - !Not [!Equals [!Ref FrontEndLoginUser, ""]]
    - !Not [!Equals [!Ref FrontEndLoginPassword, ""]]

Resources:
  # Holds the compiled front-end. Never public: CloudFront is the only reader,
  # authorised by the bucket policy below.
  FrontEndBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Bucket names are globally unique, hence the account id.
      BucketName: !Sub muncher-front-end-${Environment}-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              # SSE-S3 rather than SSE-KMS: KMS would add a per-request charge
              # and would require the distribution to sign every origin request.
              SSEAlgorithm: AES256
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # CloudFormation cannot delete a bucket that still holds objects, so deleting
  # the stack would fail on a bucket that has ever been deployed to. These four
  # resources empty it first: the custom resource below depends on the bucket, so
  # on deletion it is removed before it, and its handler clears the contents.
  FrontEndBucketEmptierLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # Named after the function so that Lambda writes here instead of creating
      # a log group of its own, which would outlive the stack.
      LogGroupName: !Sub /aws/lambda/muncher-front-end-emptier-${Environment}
      RetentionInDays: 7

  FrontEndBucketEmptierRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub muncher-front-end-emptier-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: empty-front-end-bucket
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:ListBucketVersions
                Resource: !GetAtt FrontEndBucket.Arn
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:DeleteObjectVersion
                Resource: !Sub ${FrontEndBucket.Arn}/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FrontEndBucketEmptierLogGroup.Arn

  FrontEndBucketEmptier:
    Type: AWS::Lambda::Function
    # Without this the function may be created before the log group exists, and
    # Lambda would create an unmanaged one on first invocation.
    DependsOn: FrontEndBucketEmptierLogGroup
    Properties:
      FunctionName: !Sub muncher-front-end-emptier-${Environment}
      Description: !Sub Empties the ${Environment} front-end bucket when the stack is deleted
      Runtime: python3.13
      Handler: index.handler
      Role: !GetAtt FrontEndBucketEmptierRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        ZipFile: |
          import boto3
          import cfnresponse

          s3 = boto3.client("s3")


          def empty(bucket):
              deleted = 0

              # Each round lists from the beginning rather than paginating:
              # deleting the objects a paginator has already listed invalidates
              # the marker it would continue from, which silently leaves
              # everything past the first page in place.
              while True:
                  page = s3.list_object_versions(Bucket=bucket, MaxKeys=1000)
                  objects = [
                      {"Key": item["Key"], "VersionId": item["VersionId"]}
                      for key in ("Versions", "DeleteMarkers")
                      for item in page.get(key, [])
                  ]

                  if not objects:
                      return deleted

                  s3.delete_objects(Bucket=bucket, Delete={"Objects": objects})
                  deleted += len(objects)


          def handler(event, context):
              # Only deletion needs to do anything; the resource exists solely to
              # be torn down before the bucket it points at.
              if event["RequestType"] != "Delete":
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                  return

              bucket = event["ResourceProperties"]["Bucket"]
              try:
                  deleted = empty(bucket)
                  print(f"Deleted {deleted} objects from {bucket}")
              except s3.exceptions.NoSuchBucket:
                  # Already gone: nothing to empty, and nothing to fail over.
                  print(f"{bucket} does not exist")
              except Exception as error:
                  # Reporting the failure leaves the stack in DELETE_FAILED, which
                  # is recoverable by retrying, rather than silently leaving a
                  # bucket that then blocks its own deletion.
                  print(f"Failed to empty {bucket}: {error}")
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {}, reason=str(error)
                  )
                  return

              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})

  FrontEndBucketContents:
    Type: AWS::CloudFormation::CustomResource
    Properties:
      ServiceToken: !GetAtt FrontEndBucketEmptier.Arn
      Bucket: !Ref FrontEndBucket

  # Enforces HTTP basic authentication at the edge, before the request reaches
  # the bucket. A CloudFront function rather than Lambda@Edge: the first two
  # million invocations a month are free, and it needs no role, no log group and
  # no VPC. The browser's own credentials dialog serves as the login form.
  FrontEndLoginWall:
    Type: AWS::CloudFront::Function
    Condition: LoginWallEnabled
    Properties:
      Name: !Sub muncher-front-end-login-${Environment}
      AutoPublish: true
      FunctionConfig:
        Comment: !Sub Login wall for the ${Environment} front-end
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub
        - |
          function handler(event) {
              var request = event.request;
              var authorization = request.headers.authorization;

              if (authorization && authorization.value === "Basic ${Credentials}") {
                  return request;
              }

              // 401 with this header is what makes the browser show its own
              // credentials prompt, so the application needs no login screen.
              return {
                  statusCode: 401,
                  statusDescription: "Unauthorized",
                  headers: {
                      "www-authenticate": {
                          value: 'Basic realm="muncher ${Environment}", charset="UTF-8"'
                      },
                      "cache-control": { value: "no-store" }
                  }
              };
          }
        - Credentials:
            Fn::Base64: !Sub "${FrontEndLoginUser}:${FrontEndLoginPassword}"

  FrontEndOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub muncher-front-end-${Environment}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontEndDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub muncher-front-end-${Environment}
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        DefaultRootObject: index.html
        # Cheapest class: North America and Europe only. Nothing about this
        # project justifies paying for the other edge locations.
        PriceClass: PriceClass_100
        Origins:
          - Id: front-end-bucket
            DomainName: !GetAtt FrontEndBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt FrontEndOriginAccessControl.Id
            # Required, and required to be empty, when using an access control
            # instead of the legacy origin access identity.
            S3OriginConfig:
              OriginAccessIdentity: ""
          - Id: api-function
            # An origin is a host, so the scheme and the trailing slash of the
            # function URL come off.
            DomainName: !Select [2, !Split ["/", !GetAtt ApiFunctionUrl.FunctionUrl]]
            OriginAccessControlId: !GetAtt ApiOriginAccessControl.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: front-end-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          # Managed CachingOptimized policy. Using a managed policy avoids
          # maintaining one of our own.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Runs on every viewer request, including cache hits, so the wall
          # cannot be bypassed by requesting something already cached.
          FunctionAssociations: !If
            - LoginWallEnabled
            - - EventType: viewer-request
                FunctionARN: !GetAtt FrontEndLoginWall.FunctionARN
            - !Ref AWS::NoValue
        # The API answers on this same distribution, under /api, which is what
        # makes every request from the front-end same-origin and CORS headers
        # unnecessary. Its own function URL is unreachable: origin access
        # control signs these requests, and nothing else may invoke it.
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-function
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            # Every method reaches the function, which answers 405 to the ones
            # it does not implement. Deciding that here would hide a routing
            # question behind a CloudFront error.
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - POST
              - PATCH
              - DELETE
            CachedMethods:
              - GET
              - HEAD
            # Managed CachingDisabled: the responses are data, and an edge cache
            # would serve a stale collection after a write.
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            # Managed AllViewerExceptHostHeader, which AWS documents for
            # function URL origins: the host has to be the function's own for
            # the signature origin access control adds to validate.
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
            # The wall covers the API too, so a development environment is not
            # readable through it. CloudFront replaces this Authorization
            # header with its own signature before the request leaves.
            FunctionAssociations: !If
              - LoginWallEnabled
              - - EventType: viewer-request
                  FunctionARN: !GetAtt FrontEndLoginWall.FunctionARN
              - !Ref AWS::NoValue
        # Deep links: the bucket policy grants no s3:ListBucket, so S3 answers
        # 403 rather than 404 for a path that is a route rather than a file.
        # Only 403, because mapping 404 here would turn every API 404 into the
        # front-end's index.html with a 200.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        # The name the distribution answers to, when there is one. Without it
        # CloudFront serves only its own *.cloudfront.net name.
        Aliases: !If
          - HasDomain
          - - !If
              - UseSubdomain
              - !Sub ${Environment}.${DomainName}
              - !Ref DomainName
          - !Ref AWS::NoValue
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          # No custom domain: the distribution is served over its own
          # *.cloudfront.net name and certificate.
          - CloudFrontDefaultCertificate: true
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Points the name at the distribution. Alias records rather than CNAMEs: they
  # work at the domain itself, where a CNAME is not allowed, and queries against
  # them are not billed. Route 53 is global, so these belong in this stack even
  # though the certificate could not.
  #
  # The zone is addressed by name rather than by id, so this stack needs no
  # parameter for it. Z2FDTNDATAQYW2 is CloudFront's fixed hosted zone id, the
  # same for every distribution.
  FrontEndDnsRecords:
    Type: AWS::Route53::RecordSetGroup
    Condition: HasDomain
    Properties:
      HostedZoneName: !Sub ${DomainName}.
      RecordSets:
        - Name: !If
            - UseSubdomain
            - !Sub ${Environment}.${DomainName}
            - !Ref DomainName
          Type: A
          AliasTarget:
            DNSName: !GetAtt FrontEndDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false
        - Name: !If
            - UseSubdomain
            - !Sub ${Environment}.${DomainName}
            - !Ref DomainName
          Type: AAAA
          AliasTarget:
            DNSName: !GetAtt FrontEndDistribution.DomainName
            HostedZoneId: Z2FDTNDATAQYW2
            EvaluateTargetHealth: false

  FrontEndBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontEndBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontEndBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontEndDistribution}

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # Named after the function so that Lambda writes here instead of creating
      # a log group of its own, which would outlive the stack.
      LogGroupName: !Sub /aws/lambda/muncher-api-${Environment}
      RetentionInDays: 7

  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub muncher-api-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: write-api-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt ApiLogGroup.Arn

  ApiFunction:
    Type: AWS::Lambda::Function
    # Without this the function may be created before the log group exists, and
    # Lambda would create an unmanaged one on first invocation.
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub muncher-api-${Environment}
      Description: !Sub REST API of the ${Environment} environment
      Runtime: python3.13
      # Cheaper per GB-second than x86, and the package is built for it; see
      # scripts/api-build.sh.
      Architectures:
        - arm64
      Handler: muncher_api.aws_lambda.handler
      Role: !GetAtt ApiRole.Arn
      Timeout: 10
      # Memory is also CPU, and the cold start is dominated by importing
      # FastAPI. Every invocation stays inside the free tier either way.
      MemorySize: 512
      Code:
        # A placeholder, replaced by `make api-deploy`: CloudFormation cannot
        # upload a package it does not have, so the template creates the
        # function and the deployment fills it, exactly as it creates the
        # front-end bucket empty. The handler above belongs to that package,
        # which is why it does not name this module.
        ZipFile: |
          def handler(event, context):
              raise RuntimeError("The API package has not been deployed yet")

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt ApiFunction.Arn
      AuthType: AWS_IAM

  ApiOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub muncher-api-${Environment}
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      FunctionUrlAuthType: AWS_IAM
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontEndDistribution}

  ApiFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ApiFunction.Arn
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontEndDistribution}

Outputs:
  FrontEndBucketName:
    Description: Bucket the compiled front-end is uploaded to
    Value: !Ref FrontEndBucket

  FrontEndDistributionId:
    Description: Distribution to invalidate after an upload
    Value: !Ref FrontEndDistribution

  ApiFunctionName:
    Description: Function the API package is uploaded to
    Value: !Ref ApiFunction

  # The same name the front-end is served from, since the API is a path on it.
  # The expression is repeated below rather than shared because one output
  # cannot reference another.
  ApiUrl:
    Description: Public URL of the API
    Value: !Sub
      - ${FrontEndUrl}/api
      - FrontEndUrl: !If
          - HasDomain
          - !If
            - UseSubdomain
            - !Sub https://${Environment}.${DomainName}
            - !Sub https://${DomainName}
          - !Sub https://${FrontEndDistribution.DomainName}

  FrontEndUrl:
    Description: Public URL of the front-end
    Value: !If
      - HasDomain
      - !If
        - UseSubdomain
        - !Sub https://${Environment}.${DomainName}
        - !Sub https://${DomainName}
      - !Sub https://${FrontEndDistribution.DomainName}
