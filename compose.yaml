# Local development stack, started with `make up`.
# See agents/local-development/containerized-development.md.

name: muncher

services:
  front-end:
    build:
      context: .
      dockerfile: docker/front-end.Dockerfile
    ports:
      - "${MUNCHER_FRONT_END_PORT:-5173}:5173"
    volumes:
      - ./front-end:/workspace/front-end
      # node_modules is installed into the image, so the mount above must not
      # cover it. scripts/local-env-up.sh renews this when yarn.lock changes.
      - front-end-node-modules:/workspace/front-end/node_modules
    networks:
      - muncher

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    ports:
      - "${MUNCHER_API_PORT:-9100}:9100"
    volumes:
      # Nothing to keep out of this mount: the virtual environment is in
      # /opt/venv, so a dependency change is a rebuild, not a renewed volume.
      - ./api:/workspace/api
    networks:
      - muncher

networks:
  muncher:
    driver: bridge

volumes:
  front-end-node-modules:
