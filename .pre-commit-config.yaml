# Runs inside the image built from docker/ci.Dockerfile, never against host
# tools. `local` + `language: system` hooks use what that image already carries.

exclude: |
  (?x)^(
    api/uv\.lock|
    front-end/node_modules/.*|
    front-end/\.yarn/.*|
    front-end/yarn\.lock|
    memoria/generated/.*|
    .*\.bak\d*$
  )$

repos:
  # Applied to every file, regardless of language.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      # infra/ uses short-form intrinsics (!Ref, !Sub), which a plain YAML
      # parser cannot construct. cfn-lint below validates those instead.
      - id: check-yaml
        exclude: ^infra/
      # The tsconfig files are JSONC, which a strict JSON parser rejects.
      - id: check-json
        exclude: ^front-end/tsconfig.*\.json$
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: detect-private-key
      # Raised from 500 kB: the repository tracks screenshots and hero images.
      - id: check-added-large-files
        args: [--maxkb=8000]

  # Language-specific fixes.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (front-end)
        entry: scripts/hooks/eslint.sh
        language: system
        files: ^front-end/.*\.(js|jsx|ts|tsx|mjs|cjs)$
        # Generated, and the jsdoc rules rewrite the annotations
        # openapi-typescript emits, which the openapi-types hook then restores.
        exclude: ^front-end/src/services/api/schema\.d\.ts$

      - id: prettier
        name: prettier (front-end)
        entry: scripts/hooks/prettier.sh
        language: system
        files: ^front-end/.*\.(js|jsx|ts|tsx|mjs|cjs|json|css|scss|md|html|yml|yaml)$

      # Writes front-end/src/services/api/schema.d.ts from the API's own
      # annotations. Like the formatters below, it always rewrites the file and
      # relies on pre-commit failing a modified one, so types that no longer
      # match the endpoints cannot be committed.
      - id: openapi-types
        name: openapi types (front-end)
        entry: scripts/front-end-types.sh
        language: system
        files: ^(api/src/.*\.py|front-end/src/services/api/schema\.d\.ts|scripts/front-end-types\.sh)$
        pass_filenames: false

      # Ruff exits 0 once it has fixed everything, but pre-commit still fails
      # the hook on a modified file, so no rewrite is committed unreviewed.
      - id: ruff
        name: ruff (api)
        entry: ruff check --fix
        language: system
        files: ^api/.*\.py$

      # After the linter, whose fixes can leave code that needs reformatting.
      - id: ruff-format
        name: ruff format (api)
        entry: ruff format
        language: system
        files: ^api/.*\.py$

      # Checks the whole project rather than the staged files: an edit to one
      # module surfaces as a type error in another that imports it.
      - id: ty
        name: ty (api)
        entry: ty check --project api --error all
        language: system
        files: ^api/.*\.py$
        pass_filenames: false

      # ty only rejects the blanket form, but agents/coding/types.md forbids
      # silencing the checker at all: fix the code or change the type.
      - id: no-type-suppressions
        name: no type suppressions (api)
        entry: '#\s*(ty|type|mypy|pyright):\s*ignore'
        language: pygrep
        files: ^api/.*\.py$

      - id: latexindent
        name: latexindent (memoria)
        entry: scripts/hooks/latexindent.sh
        language: system
        files: ^memoria/.*\.tex$

      - id: cfn-lint
        name: cfn-lint (infra)
        entry: cfn-lint
        language: system
        files: ^infra/.*\.(yaml|yml)$
